name: Build APK Chuan 100%

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Khoi tao kho chua
        uses: actions/checkout@v4

      - name: Cai dat Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Tao ma nguon bang Python
        run: |
          cat << 'EOF_PY' > generate_project.py
          import os

          def write_file(path, content):
              folder = os.path.dirname(path)
              if folder:
                  os.makedirs(folder, exist_ok=True)
              lines = content.strip("\n").split("\n")
              non_empty = [l for l in lines if l.strip()]
              min_indent = min(len(l) - len(l.lstrip()) for l in non_empty) if non_empty else 0
              cleaned = "\n".join(l[min_indent:] if len(l) >= min_indent else l for l in lines)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(cleaned + "\n")

          write_file("settings.gradle", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyMusicPlayer"
          include ':app'
          """)

          write_file("gradle.properties", """
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          """)

          write_file("build.gradle", """
          plugins {
              id 'com.android.application' version '8.1.4' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.10' apply false
          }
          """)

          write_file("app/build.gradle", """
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.mymusicplayer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.mymusicplayer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
