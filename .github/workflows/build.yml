          write_file("app/src/main/java/com/example/mymusicplayer/MusicService.kt", """
          package com.example.mymusicplayer

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.audiofx.BassBoost
          import android.media.audiofx.Equalizer
          import android.media.audiofx.Virtualizer
          import android.net.Uri
          import android.os.Binder
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import kotlin.random.Random

          data class Song(val id: Long, val title: String, val artist: String, val duration: Long, val uri: Uri)

          class MusicService : Service(), AudioManager.OnAudioFocusChangeListener {

              private val binder = MusicBinder()
              private var mediaPlayer: MediaPlayer? = null
              private lateinit var audioManager: AudioManager
              private var audioFocusRequest: AudioFocusRequest? = null

              private var equalizer: Equalizer? = null
              private var virtualizer: Virtualizer? = null
              private var bassBoost: BassBoost? = null

              var isSurroundEnabled = true
              var currentEqMode = 1

              var songList = mutableListOf<Song>()
              var currentIndex = -1
              var isShuffle = false
              var isRepeatOne = false
              var pauseOnOtherAudio = true
              private var resumeOnFocusGain = false

              var onSongChangedListener: (() -> Unit)? = null

              inner class MusicBinder : Binder() {
                  fun getService(): MusicService = this@MusicService
              }

              override fun onCreate() {
                  super.onCreate()
                  audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  createNotificationChannel()
              }

              override fun onBind(intent: Intent?): IBinder = binder

              override fun onAudioFocusChange(focusChange: Int) {
                  if (!pauseOnOtherAudio) return

                  when (focusChange) {
                      AudioManager.AUDIOFOCUS_LOSS -> {
                          if (isPlaying()) {
                              resumeOnFocusGain = false
                              pauseOrResume()
                          }
                      }
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> {
                          if (isPlaying()) {
                              resumeOnFocusGain = true
                              pauseOrResume()
                          }
                      }
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK -> {
                          mediaPlayer?.setVolume(0.2f, 0.2f)
                      }
                      AudioManager.AUDIOFOCUS_GAIN -> {
                          mediaPlayer?.setVolume(1.0f, 1.0f)
                          if (resumeOnFocusGain && !isPlaying()) {
                              resumeOnFocusGain = false
                              pauseOrResume()
                          }
                      }
                  }
              }

              private fun requestAudioFocus(): Boolean {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val attributes = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                          .build()
                      audioFocusRequest = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                          .setAudioAttributes(attributes)
                          .setAcceptsDelayedFocusGain(true)
                          .setOnAudioFocusChangeListener(this)
                          .build()
                      audioManager.requestAudioFocus(audioFocusRequest!!) == AudioManager.AUDIOFOCUS_REQUEST_GRANTED
                  } else {
                      @Suppress("DEPRECATION")
                      audioManager.requestAudioFocus(this, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN) == AudioManager.AUDIOFOCUS_REQUEST_GRANTED
                  }
              }

              fun playSong(index: Int) {
                  if (songList.isEmpty() || index !in songList.indices) return
                  currentIndex = index
                  val song = songList[currentIndex]

                  if (pauseOnOtherAudio) {
                      requestAudioFocus()
                  }

                  releaseAudioEffects()
                  mediaPlayer?.release()
                  mediaPlayer = MediaPlayer().apply {
                      setWakeMode(applicationContext, PowerManager.PARTIAL_WAKE_LOCK)
                      setAudioAttributes(
                          AudioAttributes.Builder()
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .build()
                      )
                      setDataSource(applicationContext, song.uri)
                      prepare()
                      start()
                      setupAudioEffects(this.audioSessionId)
                      setOnCompletionListener {
                          if (isRepeatOne) {
                              playSong(currentIndex)
                          } else {
                              playNext()
                          }
                      }
                  }

                  startForeground(1, buildNotification(song))
                  onSongChangedListener?.invoke()
              }

              private fun setupAudioEffects(audioSessionId: Int) {
                  try {
                      releaseAudioEffects()

                      virtualizer = Virtualizer(0, audioSessionId).apply {
                          enabled = isSurroundEnabled
                          if (strengthSupported) {
                              setStrength(850.toShort())
                          }
                      }

                      bassBoost = BassBoost(0, audioSessionId).apply {
                          enabled = (currentEqMode != 0)
                          if (strengthSupported) {
                              setStrength(if (currentEqMode == 1) 400.toShort() else 250.toShort())
                          }
                      }

                      equalizer = Equalizer(0, audioSessionId).apply {
                          enabled = (currentEqMode != 0)
                          val bands = numberOfBands
                          val maxLevel = bandLevelRange[1]
                          val minLevel = bandLevelRange[0]

                          if (bands >= 5) {
                              when (currentEqMode) {
                                  1 -> {
                                      setBandLevel(0, (maxLevel * 0.35).toInt().toShort())
                                      setBandLevel(1, (minLevel * 0.20).toInt().toShort())
                                      setBandLevel(2, (maxLevel * 0.25).toInt().toShort())
                                      setBandLevel(3, (maxLevel * 0.30).toInt().toShort())
                                      setBandLevel(4, (maxLevel * 0.40).toInt().toShort())
                                  }
                                  2 -> {
                                      setBandLevel(0, (maxLevel * 0.20).toInt().toShort())
                                      setBandLevel(1, (minLevel * 0.25).toInt().toShort())
                                      setBandLevel(2, (maxLevel * 0.50).toInt().toShort())
                                      setBandLevel(3, (maxLevel * 0.45).toInt().toShort())
                                      setBandLevel(4, (maxLevel * 0.35).toInt().toShort())
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun updateAudioEffects() {
                  mediaPlayer?.let { setupAudioEffects(it.audioSessionId) }
              }

              private fun releaseAudioEffects() {
                  try {
                      virtualizer?.release()
                      bassBoost?.release()
                      equalizer?.release()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun pauseOrResume() {
                  mediaPlayer?.let { player ->
                      if (player.isPlaying) {
                          player.pause()
                      } else {
                          if (pauseOnOtherAudio) requestAudioFocus()
                          player.start()
                      }
                      if (currentIndex in songList.indices) {
                          startForeground(1, buildNotification(songList[currentIndex]))
                      }
                      onSongChangedListener?.invoke()
                  }
              }

              fun playNext() {
                  if (songList.isEmpty()) return
                  val nextIndex = if (isShuffle) {
                      Random.nextInt(songList.size)
                  } else {
                      (currentIndex + 1) % songList.size
                  }
                  playSong(nextIndex)
              }

              fun playPrev() {
                  if (songList.isEmpty()) return
                  val prevIndex = if (currentIndex - 1 < 0) songList.size - 1 else currentIndex - 1
                  playSong(prevIndex)
              }

              fun isPlaying(): Boolean = mediaPlayer?.isPlaying == true
              fun getCurrentPosition(): Int = mediaPlayer?.currentPosition ?: 0
              fun getDuration(): Int = mediaPlayer?.duration ?: 0
              fun seekTo(pos: Int) { mediaPlayer?.seekTo(pos) }
              fun getCurrentSong(): Song? = if (currentIndex in songList.indices) songList[currentIndex] else null

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "MUSIC_CHANNEL",
                          "Phát Nhạc Chạy Ngầm",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(song: Song): Notification {
                  val openAppIntent = Intent(this, MainActivity::class.java)
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, openAppIntent,
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  val status = if (isPlaying()) "Đang phát" else "Đã tạm dừng"
                  return NotificationCompat.Builder(this, "MUSIC_CHANNEL")
                      .setContentTitle(song.title)
                      .setContentText(song.artist + " (" + status + ")")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(pendingIntent)
                      .setOngoing(isPlaying())
                      .build()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  releaseAudioEffects()
                  mediaPlayer?.release()
              }
          }
          """)

          write_file("app/src/main/java/com/example/mymusicplayer/MainActivity.kt", """
          package com.example.mymusicplayer

          import android.Manifest
          import android.content.*
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.os.*
          import android.provider.MediaStore
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity() {

              private var musicService: MusicService? = null
              private var isBound = false

              private lateinit var listView: ListView
              private lateinit var etSearch: EditText
              private lateinit var tvNowPlaying: TextView
              private lateinit var tvArtist: TextView
              private lateinit var tvCurrentTime: TextView
              private lateinit var tvTotalTime: TextView
              private lateinit var seekBar: SeekBar
              private lateinit var btnPlayPause: Button
              private lateinit var btnNext: Button
              private lateinit var btnPrev: Button
              private lateinit var btnShuffle: Button
              private lateinit var btnRepeat: Button
              private lateinit var btnSurround: Button
              private lateinit var btnEqMode: Button
              private lateinit var switchAudioFocus: Switch

              private val allSongs = mutableListOf<Song>()
              private val displayedSongs = mutableListOf<Song>()
              private lateinit var adapter: ArrayAdapter<String>

              private val handler = Handler(Looper.getMainLooper())
              private val updateSeekBarRunnable = object : Runnable {
                  override fun run() {
                      musicService?.let { service ->
                          if (service.isPlaying()) {
                              seekBar.max = service.getDuration()
                              seekBar.progress = service.getCurrentPosition()
                              tvCurrentTime.text = formatTime(service.getCurrentPosition().toLong())
                              tvTotalTime.text = formatTime(service.getDuration().toLong())
                          }
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              private val serviceConnection = object : ServiceConnection {
                  override fun onServiceConnected(name: ComponentName?, binder: IBinder?) {
                      val musicBinder = binder as MusicService.MusicBinder
                      musicService = musicBinder.getService()
                      isBound = true
                      musicService?.songList = displayedSongs
                      musicService?.pauseOnOtherAudio = switchAudioFocus.isChecked
                      musicService?.onSongChangedListener = {
                          runOnUiThread { updateUI() }
                      }
                      updateUI()
                  }

                  override fun onServiceDisconnected(name: ComponentName?) {
                      isBound = false
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  initViews()
                  checkPermissions()

                  val serviceIntent = Intent(this, MusicService::class.java)
                  startService(serviceIntent)
                  bindService(serviceIntent, serviceConnection, Context.BIND_AUTO_CREATE)

                  handler.post(updateSeekBarRunnable)
              }

              private fun initViews() {
                  listView = findViewById(R.id.listViewSongs)
                  etSearch = findViewById(R.id.etSearch)
                  tvNowPlaying = findViewById(R.id.tvNowPlaying)
                  tvArtist = findViewById(R.id.tvArtist)
                  tvCurrentTime = findViewById(R.id.tvCurrentTime)
                  tvTotalTime = findViewById(R.id.tvTotalTime)
                  seekBar = findViewById(R.id.seekBar)
                  btnPlayPause = findViewById(R.id.btnPlayPause)
                  btnNext = findViewById(R.id.btnNext)
                  btnPrev = findViewById(R.id.btnPrev)
                  btnShuffle = findViewById(R.id.btnShuffle)
                  btnRepeat = findViewById(R.id.btnRepeat)
                  btnSurround = findViewById(R.id.btnSurround)
                  btnEqMode = findViewById(R.id.btnEqMode)
                  switchAudioFocus = findViewById(R.id.switchAudioFocus)

                  switchAudioFocus.setOnCheckedChangeListener { _, isChecked ->
                      musicService?.pauseOnOtherAudio = isChecked
                      val msg = if (isChecked) "Đã bật: Tự dừng khi có cuộc gọi/video khác" else "Đã tắt: Phát đè lên mọi âm thanh"
                      Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  }

                  btnSurround.setOnClickListener {
                      musicService?.let { service ->
                          service.isSurroundEnabled = !service.isSurroundEnabled
                          service.updateAudioEffects()
                          btnSurround.text = if (service.isSurroundEnabled) "🎧 Vòm 3D: Bật" else "🎧 Vòm 3D: Tắt"
                          btnSurround.backgroundTintList = ColorStateList.valueOf(
                              if (service.isSurroundEnabled) Color.parseColor("#1DB954") else Color.parseColor("#333333")
                          )
                          btnSurround.setTextColor(if (service.isSurroundEnabled) Color.BLACK else Color.WHITE)
                      }
                  }

                  btnEqMode.setOnClickListener {
                      musicService?.let { service ->
                          service.currentEqMode = (service.currentEqMode + 1) % 3
                          service.updateAudioEffects()
                          when (service.currentEqMode) {
                              0 -> {
                                  btnEqMode.text = "🎚️ Âm: Gốc (Tắt EQ)"
                                  btnEqMode.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#333333"))
                                  btnEqMode.setTextColor(Color.WHITE)
                              }
                              1 -> {
                                  btnEqMode.text = "🎚️ Âm: Fix Chip Jerry"
                                  btnEqMode.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#1DB954"))
                                  btnEqMode.setTextColor(Color.BLACK)
                              }
                              2 -> {
                                  btnEqMode.text = "🎚️ Âm: Ngọt Giọng / Bolero"
                                  btnEqMode.backgroundTintList = ColorStateList.valueOf(Color.parseColor("#FF9800"))
                                  btnEqMode.setTextColor(Color.BLACK)
                              }
                          }
                      }
                  }

                  listView.setOnItemClickListener { _, _, position, _ ->
                      musicService?.songList = displayedSongs
                      musicService?.playSong(position)
                  }

                  btnPlayPause.setOnClickListener { musicService?.pauseOrResume() }
                  btnNext.setOnClickListener { musicService?.playNext() }
                  btnPrev.setOnClickListener { musicService?.playPrev() }

                  btnShuffle.setOnClickListener {
                      musicService?.let {
                          it.isShuffle = !it.isShuffle
                          btnShuffle.text = if (it.isShuffle) "🔀 Bật" else "🔀 Tắt"
                          btnShuffle.setTextColor(if (it.isShuffle) Color.parseColor("#1DB954") else Color.WHITE)
                      }
                  }

                  btnRepeat.setOnClickListener {
                      musicService?.let {
                          it.isRepeatOne = !it.isRepeatOne
                          btnRepeat.text = if (it.isRepeatOne) "🔂 1 Bài" else "🔁 Tắt"
                          btnRepeat.setTextColor(if (it.isRepeatOne) Color.parseColor("#1DB954") else Color.WHITE)
                      }
                  }

                  seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) musicService?.seekTo(progress)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })

                  etSearch.addTextChangedListener(object : TextWatcher {
                      override fun afterTextChanged(s: Editable?) {
                          filterSongs(s.toString())
                      }
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                  })
              }

              private fun filterSongs(query: String) {
                  displayedSongs.clear()
                  if (query.isEmpty()) {
                      displayedSongs.addAll(allSongs)
                  } else {
                      val lowerQuery = query.lowercase()
                      displayedSongs.addAll(allSongs.filter {
                          it.title.lowercase().contains(lowerQuery) || it.artist.lowercase().contains(lowerQuery)
                      })
                  }
                  updateListView()
              }

              private fun updateUI() {
                  musicService?.let { service ->
                      val currentSong = service.getCurrentSong()
                      if (currentSong != null) {
                          tvNowPlaying.text = currentSong.title
                          tvArtist.text = currentSong.artist
                          btnPlayPause.text = if (service.isPlaying()) "⏸ Dừng" else "▶ Phát"
                          seekBar.max = service.getDuration()
                          tvTotalTime.text = formatTime(service.getDuration().toLong())
                      }
                  }
              }

              private fun checkPermissions() {
                  val permissions = mutableListOf<String>()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissions.add(Manifest.permission.READ_MEDIA_AUDIO)
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  } else {
                      permissions.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }

                  val notGranted = permissions.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (notGranted.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, notGranted.toTypedArray(), 100)
                  } else {
                      loadSongsFromDevice()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 100 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      loadSongsFromDevice()
                  }
              }

              private fun loadSongsFromDevice() {
                  allSongs.clear()
                  val uri = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.ARTIST,
                      MediaStore.Audio.Media.DURATION
                  )
                  val selection = MediaStore.Audio.Media.IS_MUSIC + " != 0 AND " + MediaStore.Audio.Media.DURATION + " >= 15000"
                  val sortOrder = MediaStore.Audio.Media.TITLE + " ASC"

                  contentResolver.query(uri, projection, selection, null, sortOrder)?.use { cursor ->
                      val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                      val titleCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                      val artistCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                      val durationCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)

                      while (cursor.moveToNext()) {
                          val id = cursor.getLong(idCol)
                          val title = cursor.getString(titleCol) ?: "Không tên"
                          val artist = cursor.getString(artistCol) ?: "Nghệ sĩ"
                          val duration = cursor.getLong(durationCol)
                          val contentUri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)

                          allSongs.add(Song(id, title, artist, duration, contentUri))
                      }
                  }
                  displayedSongs.clear()
                  displayedSongs.addAll(allSongs)
                  updateListView()
              }

              private fun updateListView() {
                  val listNames = displayedSongs.map { it.title + "\n" + it.artist + " • " + formatTime(it.duration) }
                  adapter = object : ArrayAdapter<String>(this, android.R.layout.simple_list_item_1, listNames) {
                      override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                          val view = super.getView(position, convertView, parent) as TextView
                          view.setTextColor(Color.WHITE)
                          view.textSize = 15f
                          view.setPadding(16, 20, 16, 20)
                          return view
                      }
                  }
                  listView.adapter = adapter
              }

              private fun formatTime(millis: Long): String {
                  val minutes = TimeUnit.MILLISECONDS.toMinutes(millis)
                  val seconds = TimeUnit.MILLISECONDS.toSeconds(millis) % 60
                  return String.format("%02d:%02d", minutes, seconds)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  handler.removeCallbacks(updateSeekBarRunnable)
                  if (isBound) {
                      unbindService(serviceConnection)
                      isBound = false
                  }
              }
          }
          """)
